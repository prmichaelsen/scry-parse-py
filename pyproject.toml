[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scry-parse"
version = "1.2.1"
description = "Python parser for scry-spec v1.2 markers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/prmichaelsen/scry-parse-py"

[tool.hatch.build.targets.wheel]
packages = ["src/scry_parse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
